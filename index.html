<style>
  :root {
    --bg: #FFFFFF;

    --accent: #2B4C9B;

    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {

  a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.2em; text-decoration-color: var(--muted); }
  a:hover { color: var(--accent); text-decoration-color: var(--accent); }

  .when { color: var(--muted); font-size: 0.9375rem; font-variant-numeric: tabular-nums; padding-top: 0.05rem; }
  .t { display: block; font-weight: 500; }
  .s { display: block; color: var(--muted); }
  .list.quiet .t { font-weight: 400; }
  .list.quiet .s { font-size: 0.9375rem; }

  details summary { list-style: none; cursor: pointer; position: relative; padding-right: 1.75rem; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "+"; position: absolute; right: 0; top: 0; color: var(--muted); }
  details[open] summary::after { content: "\2212"; }
  details summary:hover .t { text-decoration: underline; text-underline-offset: 0.2em; text-decoration-thickness: 1px; }

  .more { margin-top: 0.7rem; }
  .more p { margin: 0 0 0.6rem; }
  .more .meta { color: var(--muted); font-size: 0.9375rem; }
  .more ul { margin: 0 0 0.7rem; padding-left: 1.1rem; list-style: disc; }
  .more li { margin-bottom: 0.45rem; }
  .more li::marker { color: var(--muted); }
  .more .stack { color: var(--muted); font-size: 0.9375rem; }
  .more .links { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; font-size: 0.9375rem; }
  .ext { display: inline-block; margin-top: 0.3rem; font-size: 0.9375rem; }

  .contact-line { margin: 0 0 0.35rem; }
  .muted { color: var(--muted); }

    .entry { grid-template-columns: 1fr; row-gap: 0.05rem; margin-bottom: 1.25rem; }

</style>

/* ============================================================== */

const $ = (id) => document.getElementById(id);
const isWeb = (u) => /^https?:/.test(u);
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function link(l) {
  const a = h("a", null, l.label);
  a.href = l.url;
  if (isWeb(l.url)) { a.target = "_blank"; a.rel = "noopener"; }
  return a;
}

/* One entry: optional date, title, subtitle, and an optional expandable body */
function entry(e) {
  const li = h("li", "entry" + (e.lead == null ? " no-when" : ""));
  if (e.lead != null) li.appendChild(h("span", "when", e.lead));

  const what = h("div");
  const expandable = (e.points && e.points.length) || e.body;

  const head = (tag) => {
    const el = h(tag);
    el.appendChild(h("span", "t", e.title));
    if (e.sub) el.appendChild(h("span", "s", e.sub));
    return el;
  };

  if (expandable) {
    const d = h("details");
    d.appendChild(head("summary"));
    const more = h("div", "more");
    if (e.meta) more.appendChild(h("p", "meta", e.meta));
    if (e.body) more.appendChild(h("p", null, e.body));
    if (e.points && e.points.length) {
      const ul = h("ul");
      e.points.forEach((t) => ul.appendChild(h("li", null, t)));
      more.appendChild(ul);
    }
    if (e.tags && e.tags.length) more.appendChild(h("p", "stack", e.tags.join(", ")));
    if (e.links && e.links.length) {
      const p = h("p", "links");
      e.links.forEach((l) => p.appendChild(link(l)));
      more.appendChild(p);
    }
    d.appendChild(more);
    what.appendChild(d);
  } else {
    what.appendChild(head("div"));
  }

  if (e.ext) {
    const a = link(e.ext);
    a.className = "ext";
    what.appendChild(a);
  }
  li.appendChild(what);
  return li;
}

/* Intro */

  const ol = h("ol", "list");

});

SITE.research.forEach((r) => $("research-list").appendChild(entry({ ...r, ext: r.links && r.links[0] })));
SITE.events.forEach((e) => $("events-list").appendChild(entry(e)));
SITE.awards.forEach((a) => $("award-list").appendChild(entry(a)));

  SITE.writing.forEach((w) => $("writing-list").appendChild(entry({ lead: w.lead, title: w.title, sub: w.sub, ext: { label: "Read", url: w.url } })));
